<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no, interactive-widget=resizes-content" />
  <title>第一性原理引擎 · First Principles Engine</title>
  <meta name="description" content="把目标一路「下钻」到马上能做的事：要做到 A，必须先做到 B；要做到 B，必须先做到 C。全程大白话。" />
  <meta name="theme-color" content="#0e0e10" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='0.9em' font-size='90'%3E%E2%9A%9B%EF%B8%8F%3C/text%3E%3C/svg%3E" />
  <link rel="apple-touch-icon" href="./icons/icon-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="第一性原理" />
  <meta name="mobile-web-app-capable" content="yes" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="bg-glow bg-glow-1"></div>
  <div class="bg-glow bg-glow-2"></div>

  <div class="app">
    <!-- ================= 左侧工作空间栏 ================= -->
    <aside class="workspace" id="workspace">
      <div class="ws-head">
        <div class="brand">
          <div class="brand-mark">⚛️</div>
          <div class="brand-text">
            <h1>第一性原理引擎</h1>
            <p>First Principles Engine</p>
          </div>
        </div>
        <button class="btn btn-primary btn-block" id="btnNewDerive">＋ 开始新推导</button>
      </div>

      <div class="ws-scroll">
        <section class="ws-section">
          <h3 class="ws-title">当前会话</h3>
          <div id="currentSession" class="current-session"></div>
        </section>

        <section class="ws-section">
          <h3 class="ws-title">历史记录</h3>
          <div id="historyList" class="history-list"></div>
        </section>

        <section class="ws-section">
          <h3 class="ws-title">🌌 原理图谱</h3>
          <div class="viz-wrap" id="vizWrap">
            <svg id="vizSvg"></svg>
            <div class="viz-empty" id="vizEmpty">暂无数据<br /><span>开始推导后自动生成</span></div>
          </div>
        </section>
      </div>

      <div class="ws-foot">
        <button class="btn btn-ghost" id="btnExport" title="导出全部记录为 Markdown">⬇ 导出</button>
        <button class="btn btn-ghost danger" id="btnClear" title="清空所有记录">✕ 清空</button>
      </div>
    </aside>
    <div class="ws-backdrop" id="wsBackdrop"></div>

    <!-- ================= 右侧主推导区 ================= -->
    <main class="main" id="main">
      <div class="main-top">
        <button class="icon-btn sidebar-toggle" id="btnSidebar" title="切换工作空间栏">☰</button>
        <button class="icon-btn" id="btnTheme" title="切换主题">☀️</button>
        <span class="health-badge" id="healthBadge" title="后端与模型状态">…</span>
      </div>

      <div class="main-body">
        <!-- 输入区 -->
        <div class="card input-card">
          <div class="seg" id="modeSeg" role="tablist">
            <button class="seg-btn active" data-mode="goal" role="tab">🎯 目标拆解</button>
            <button class="seg-btn" data-mode="text" role="tab">📝 随心所想</button>
          </div>
          <div class="mode-hint" id="modeHint">
            输入一个目的（如“减肥”“创业”“学英语”），我会拆出达成它必须先达成的前置目的。
          </div>
          <textarea id="inputText" rows="3" maxlength="30000"
            placeholder="例如：我想在三个月内把体重从 80kg 降到 70kg，同时保持精力充沛……"></textarea>
          <div class="input-row">
            <span class="char-count"><span id="charCount">0</span> / 30000</span>
            <button class="btn btn-primary" id="btnSubmit"><span class="btn-icon">⚡</span><span>开始拆解</span></button>
          </div>
        </div>

        <!-- 主内容：目标卡片 + 下钻链 + 操作条 + 总结 -->
        <div id="mainContent" class="main-content"></div>
      </div>
    </main>
  </div>

  <div id="toast" class="toast"></div>

  <script src="tree.js"></script>
  <script src="md.js"></script>
  <script src="app.js"></script>
</body>
</html>
